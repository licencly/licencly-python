name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor pyproject declares. Vendors shipping desktop Python
        # are often pinned well behind current.
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # cryptography is the only runtime dependency, for Ed25519, which the
      # standard library does not provide on any supported version.
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
